---

grafana_active: true

grafana_config_server_domain: localhost
grafana_config_server_http_port: 3000
grafana_config_server_root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
grafana_config_server_serve_from_sub_path: "false"

grafana_service_enabled: true
grafana_service_name: grafana.service
grafana_service_state: started
